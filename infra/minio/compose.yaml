services:
  minio:
    image: hydra-minio:RELEASE.2025-10-15T17-29-55Z
    container_name: hydra-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  minio-data:
    external: true
    name: hydra-minio-data
