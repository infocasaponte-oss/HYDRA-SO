name: HYDRA CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: hydra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install HYDRA with development dependencies
        run: |
          # setuptools>=83: older versions carry PYSEC-2025-49 / PYSEC-2026-3447 and fail the audit
          python -m pip install --upgrade pip "setuptools>=83" wheel build pip-audit
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Version matches packaging metadata
        run: |
          python - <<'PY'
          import tomllib
          import hydra
          expected = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          assert hydra.__version__ == expected, (hydra.__version__, expected)
          print("HYDRA", hydra.__version__)
          PY

      - name: Compile Python sources
        run: python -m compileall -q hydra

      - name: Run test suite
        run: pytest -q

      - name: Audit installed dependencies
        run: python -m pip_audit --skip-editable

      - name: Build wheel
        run: python -m build --wheel --outdir "$RUNNER_TEMP/dist"

      - name: Wheel smoke test outside the source tree
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$RUNNER_TEMP/venv/Scripts"; else BIN="$RUNNER_TEMP/venv/bin"; fi
          "$BIN/python" -m pip install -q --upgrade pip
          "$BIN/python" -m pip install -q "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$BIN/hydra" --help > /dev/null
          export HYDRA_OFFLINE=true HYDRA_DATA_DIR="$RUNNER_TEMP/data"
          "$BIN/hydra" run "¿Cuánto es 2+2?" | tee answer.txt
          grep -q "4" answer.txt
          "$BIN/python" -c "import hydra.api.main as m; assert len(m.app.state.runtime_routes) >= 15"
