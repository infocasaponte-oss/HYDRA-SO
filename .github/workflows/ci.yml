name: HYDRA 1.0 CI

on:
  push:
    branches:
      - hydra-1.0
      - integration/hydra-1.0
  pull_request:

permissions:
  contents: read

concurrency:
  group: hydra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install HYDRA with development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Package import smoke test
        run: |
          python - <<'PY'
          import hydra
          print("HYDRA", hydra.__version__)
          assert hydra.__version__ == "1.0.0"
          PY

      - name: Compile Python sources
        run: python -m compileall -q hydra

      - name: Run test suite
        run: pytest -q
