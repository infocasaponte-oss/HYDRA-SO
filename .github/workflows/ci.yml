name: HYDRA CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: hydra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install HYDRA with development dependencies
        run: |
          # setuptools>=83: older versions carry PYSEC-2025-49 / PYSEC-2026-3447 and fail the audit
          python -m pip install --upgrade pip "setuptools>=83" wheel build pip-audit
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Version matches packaging metadata
        run: |
          python - <<'PY'
          import tomllib
          import hydra
          expected = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          assert hydra.__version__ == expected, (hydra.__version__, expected)
          print("HYDRA", hydra.__version__)
          PY

      - name: Compile Python sources
        run: python -m compileall -q hydra

      - name: Run test suite
        run: pytest -q

      - name: Audit installed dependencies
        run: python -m pip_audit --skip-editable

      - name: Build wheel
        run: python -m build --wheel --outdir "$RUNNER_TEMP/dist"

      - name: Wheel smoke test outside the source tree
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$RUNNER_TEMP/venv/Scripts"; else BIN="$RUNNER_TEMP/venv/bin"; fi
          "$BIN/python" -m pip install -q --upgrade pip
          "$BIN/python" -m pip install -q "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$BIN/hydra" --help > /dev/null
          export HYDRA_OFFLINE=true HYDRA_DATA_DIR="$RUNNER_TEMP/data"
          "$BIN/hydra" run "¿Cuánto es 2+2?" | tee answer.txt
          grep -q "4" answer.txt
          "$BIN/python" -c "import hydra.api.main as m; assert len(m.app.state.runtime_routes) >= 15"

  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t hydra-ci .

      - name: Container starts and serves /health
        run: |
          docker run -d --name hydra-ci -e HYDRA_OFFLINE=true hydra-ci
          for i in $(seq 1 30); do
            if docker exec hydra-ci python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"; then
              docker exec hydra-ci sh -c 'python --version && docker --version && pip check'
              exit 0
            fi
            sleep 2
          done
          docker logs hydra-ci
          exit 1

      - name: Installed CLI finds its packaged resources (worker / factory entrypoints)
        run: |
          # Console scripts import hydra from site-packages (not /app): schema and configs must be installed.
          docker run --rm --entrypoint hydra hydra-ci worker --help > /dev/null
          docker run --rm --workdir /tmp hydra-ci python -c "from hydra.persistence.postgres import SCHEMA; assert SCHEMA.is_file(), SCHEMA; print(SCHEMA)"
          docker run --rm --workdir /tmp hydra-ci python -c "import importlib.resources as r; assert r.files('hydra').joinpath('api/evaluation_review.html').is_file()"

  integration:
    name: integration (PostgreSQL, Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: hydra, POSTGRES_PASSWORD: hydra, POSTGRES_DB: hydra}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hydra" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8
        ports: ["6379:6379"]
    env:
      HYDRA_IT_POSTGRES: postgresql://hydra:hydra@localhost:5432/hydra
      HYDRA_IT_REDIS: redis://localhost:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,postgres,redis]"
      - name: Fabric contract and infrastructure integration
        run: pytest -q -rs tests/test_fabric_backends.py tests/test_integration_infra.py

  manifests:
    name: deployment manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Kubernetes schemas (kubeconform)
        run: |
          docker run --rm -v "$PWD/infra/kubernetes:/k8s:ro" ghcr.io/yannh/kubeconform:latest-alpine             -strict -summary -ignore-missing-schemas /k8s
      - name: Compose files
        run: docker compose --profile gpu --profile nats --profile observability config -q
      - name: Terraform
        run: |
          docker run --rm -v "$PWD/infra:/infra" -w /infra/terraform hashicorp/terraform:latest init -backend=false -input=false
          docker run --rm -v "$PWD/infra:/infra" -w /infra/terraform hashicorp/terraform:latest validate

  sdk-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Type-check and build
        run: |
          npm ci --no-audit --no-fund
          npx tsc -p .
