name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m compileall -q hydra
      - run: pytest -q
      - run: pip-audit
      - run: python -m build --wheel
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -c "import hydra; print(hydra.__version__)"
